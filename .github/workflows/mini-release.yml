name: Build and release Mini and Dual Stream Decks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mini-release.yml'
      - 'mini/**'
      - 'build-inputs/**'
      - 'tools/apply_shortcut_layout.py'
      - 'tools/animate_shortcuts.py'
      - 'tools/puft.b64'
      - 'tools/patch_shortcut_feedback.py'
permissions:
  contents: write
concurrency:
  group: streamdeck-mini-v1-release
  cancel-in-progress: false
jobs:
  mini:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified v1 input artwork and scripts
        run: |
          set -euo pipefail
          test "$(find build-inputs -name '*.b64' | wc -l)" -eq 24
          cat build-inputs/*.b64 | base64 --decode > /tmp/mini-inputs.tar.gz
          echo '0858947cd0e25ca9b4e8629f81358e4168f4e13685c4177699813c22118fa1fe  /tmp/mini-inputs.tar.gz' | sha256sum --check
          mkdir -p /tmp/mini-base
          tar -xzf /tmp/mini-inputs.tar.gz -C /tmp/mini-base
          cp -a docs /tmp/mini-docs
      - name: Install pinned image preparation dependency
        run: |
          python3 -m venv /tmp/mini-python
          /tmp/mini-python/bin/pip install Pillow==11.3.0
          echo '/tmp/mini-python/bin' >> "$GITHUB_PATH"
      - name: Prepare the six-key package
        run: |
          set -eu
          python3 tools/apply_shortcut_layout.py /tmp/mini-base
          python3 tools/animate_shortcuts.py /tmp/mini-base /tmp/mini-docs
          python3 tools/patch_shortcut_feedback.py /tmp/mini-base
          python3 mini/prepare_mini.py /tmp/mini-base package/MiSTer_StreamDeck_Mini_v1_0_2 --guide /tmp/mini-docs/mini.html
          cp /tmp/mini-docs/mini.html package/MiSTer_StreamDeck_Mini_v1_0_2/Mini_Guide.html
          python3 mini/prepare_dual.py /tmp/mini-base package/MiSTer_StreamDeck_Mini_v1_0_2 package/MiSTer_StreamDeck_Dual_v1_0_0
      - name: Test Mini protocol, paging and package
        run: |
          set -eu
          gcc -O2 -Wall -Wextra -Werror mini/streamdeck-mini.c -o /tmp/mini-host
          gcc -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined mini/test_mini.c -o /tmp/test-mini
          ASAN_OPTIONS=detect_leaks=1 /tmp/test-mini "$PWD/package/MiSTer_StreamDeck_Mini_v1_0_2/Scripts/.config/streamdeck-mini/buttons.conf"
          python3 mini/test_package.py package/MiSTer_StreamDeck_Mini_v1_0_2 /tmp/mini-host
          find package -name '*.sh' -exec sh -n '{}' ';'
      - name: Test MK.2 and simultaneous service operation
        run: |
          set -eu
          app=package/MiSTer_StreamDeck_Dual_v1_0_0/Scripts/.config/streamdeck
          gcc -O2 -Wall -Wextra -Werror "$app/source/streamdeck.c" -o /tmp/mk2-host
          gcc -O2 -Wall -Wextra -Werror "$app/source/test_internal.c" -o /tmp/mk2-internal
          python3 "$app/source/test_host.py" /tmp/mk2-host
          python3 "$app/source/test_failures.py" /tmp/mk2-host /tmp/mk2-internal
          /tmp/mk2-internal
          gcc -O2 -Wall -Wextra -Werror "$app/source/test_pages.c" -o /tmp/mk2-pages
          /tmp/mk2-pages
          gcc -O2 -Wall -Wextra -Werror "$app/source/test_memory.c" -o /tmp/mk2-memory
          (cd "$app" && /tmp/mk2-memory buttons.conf icons)
          python3 mini/test_dual.py package/MiSTer_StreamDeck_Dual_v1_0_0 /tmp/mini-host /tmp/mk2-host
      - name: Install pinned Zig compiler
        run: |
          set -eu
          curl --fail --location --retry 3 https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o /tmp/mini-zig.tar.xz
          tar -xJf /tmp/mini-zig.tar.xz -C /tmp
          echo '/tmp/zig-linux-x86_64-0.13.0' >> "$GITHUB_PATH"
      - name: Cross-compile the static MiSTer binary
        working-directory: package/MiSTer_StreamDeck_Mini_v1_0_2/Scripts/.config/streamdeck-mini
        run: |
          set -eu
          sh source/build.sh
          file streamdeck-mister | tee /tmp/mini-binary-info
          grep -q ARM /tmp/mini-binary-info
          grep -q 'statically linked' /tmp/mini-binary-info
      - name: Cross-compile MK.2 and assemble both binaries
        run: |
          set -eu
          app=package/MiSTer_StreamDeck_Dual_v1_0_0/Scripts/.config/streamdeck
          sh "$app/source/build.sh"
          file "$app/streamdeck-mister" | tee /tmp/mk2-binary-info
          grep -q ARM /tmp/mk2-binary-info
          grep -q 'statically linked' /tmp/mk2-binary-info
          cp package/MiSTer_StreamDeck_Mini_v1_0_2/Scripts/.config/streamdeck-mini/streamdeck-mister package/MiSTer_StreamDeck_Dual_v1_0_0/Scripts/.config/streamdeck-mini/streamdeck-mister
      - name: Package and verify the Mini release
        run: |
          set -eu
          for bundle in MiSTer_StreamDeck_Mini_v1_0_2 MiSTer_StreamDeck_Dual_v1_0_0; do
            (cd "package/$bundle" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
            (cd package && zip -qr "../$bundle.zip" "$bundle")
            sha256sum "$bundle.zip" > "$bundle.zip.sha256"
            unzip -t "$bundle.zip"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: MiSTer_StreamDeck_Mini_v1_0_2
          path: |
            MiSTer_StreamDeck_Mini_v1_0_2.zip
            MiSTer_StreamDeck_Mini_v1_0_2.zip.sha256
            MiSTer_StreamDeck_Dual_v1_0_0.zip
            MiSTer_StreamDeck_Dual_v1_0_0.zip.sha256
          if-no-files-found: error
      - name: Publish a separate Mini release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view mini-v1.0.2 >/dev/null 2>&1; then
            gh release upload mini-v1.0.2 MiSTer_StreamDeck_Mini_v1_0_2.zip MiSTer_StreamDeck_Mini_v1_0_2.zip.sha256 --clobber
          else
            gh release create mini-v1.0.2 MiSTer_StreamDeck_Mini_v1_0_2.zip MiSTer_StreamDeck_Mini_v1_0_2.zip.sha256 --target "$GITHUB_SHA" --title 'MiSTer Stream Deck Mini v1.0.2' --notes-file mini/RELEASE_NOTES.md --latest=false
          fi
          if gh release view dual-v1.0.0 >/dev/null 2>&1; then
            gh release upload dual-v1.0.0 MiSTer_StreamDeck_Dual_v1_0_0.zip MiSTer_StreamDeck_Dual_v1_0_0.zip.sha256 --clobber
          else
            gh release create dual-v1.0.0 MiSTer_StreamDeck_Dual_v1_0_0.zip MiSTer_StreamDeck_Dual_v1_0_0.zip.sha256 --target "$GITHUB_SHA" --title 'MiSTer Stream Deck Dual v1.0.0' --notes-file mini/DUAL_README.md --latest=false
          fi
